# Required for building jre_lwjgl3glfw with Java 8 while using plugins in app_pojavlauncher that require Java 11
org.gradle.configureondemand=true
# Run the Kotlin compiler in the Gradle process so Kotlin compile errors
# appear in the build log instead of being swallowed by a detached daemon
org.gradle.kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
android.bundle.language.enableSplit=false
# Increase Gradle daemon RAM allocation
org.gradle.jvmargs=-Xmx4096M
android.nonTransitiveRClass=false
android.nonFinalResIds=false
